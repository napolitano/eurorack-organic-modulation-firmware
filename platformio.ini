; PlatformIO project configuration for the Free Modular Drift alternative firmware.
;
; Environments mirror the engineering pattern used by eurorack-quantizer-firmware:
;   nanoatmega328new         Arduino Nano, current bootloader (default)
;   nanoatmega328            Arduino Nano, legacy bootloader
;   native                           Classic-bank host-side Unity tests
;   native_coverage                  Classic-bank GCC/gcov coverage instrumentation
;   native_sanitized                 Classic-bank ASan/UBSan
;   nanoatmega328new_timing          Classic-bank non-release timing probe image
;   nanoatmega328new_organic         Organic-bank Nano, current bootloader
;   nanoatmega328_organic            Organic-bank Nano, legacy bootloader
;   native_organic                   Organic-bank host-side Unity tests
;   native_organic_coverage          Organic-bank GCC/gcov coverage instrumentation
;   native_organic_sanitized         Organic-bank ASan/UBSan
;   nanoatmega328new_organic_timing  Organic-bank timing probe image
;   nanoatmega328new_generative      Generative-bank Nano, current bootloader
;   nanoatmega328_generative         Generative-bank Nano, legacy bootloader
;   native_generative                Generative-bank host-side Unity tests
;   native_generative_coverage       Generative-bank GCC/gcov coverage instrumentation
;   native_generative_sanitized      Generative-bank ASan/UBSan
;   nanoatmega328new_generative_timing Generative-bank timing probe image
;   nanoatmega328new_ambient          Ambient-bank Nano, current bootloader
;   nanoatmega328_ambient             Ambient-bank Nano, legacy bootloader
;   native_ambient                    Ambient-bank host-side Unity tests
;   native_ambient_coverage           Ambient-bank GCC/gcov coverage instrumentation
;   native_ambient_sanitized          Ambient-bank ASan/UBSan
;   nanoatmega328new_ambient_timing   Ambient-bank timing probe image
;   nanoatmega328new_electronica      Electronica-bank Nano, current bootloader
;   nanoatmega328_electronica         Electronica-bank Nano, legacy bootloader
;   native_electronica                Electronica-bank host-side Unity tests
;   native_electronica_coverage       Electronica-bank GCC/gcov coverage instrumentation
;   native_electronica_sanitized      Electronica-bank ASan/UBSan
;   nanoatmega328new_electronica_timing Electronica-bank timing probe image
;   nanoatmega328new_percussion      Percussion-bank Nano, current bootloader
;   nanoatmega328_percussion         Percussion-bank Nano, legacy bootloader
;   native_percussion                Percussion-bank host-side Unity tests
;   native_percussion_coverage       Percussion-bank GCC/gcov coverage instrumentation
;   native_percussion_sanitized      Percussion-bank ASan/UBSan
;   nanoatmega328new_percussion_timing Percussion-bank timing probe image
;   nanoatmega328new_dubstep         Dubstep/Bass-bank Nano, current bootloader
;   nanoatmega328_dubstep            Dubstep/Bass-bank Nano, legacy bootloader
;   native_dubstep                    Dubstep/Bass-bank host-side Unity tests
;   native_dubstep_coverage           Dubstep/Bass-bank GCC/gcov coverage instrumentation
;   native_dubstep_sanitized          Dubstep/Bass-bank ASan/UBSan
;   nanoatmega328new_dubstep_timing   Dubstep/Bass-bank timing probe image
;
; Developer-only named algorithm targeting:
;   FMD_FORCE_ALGORITHM=breath pio run -e nanoatmega328new_ambient -t upload
; locks the firmware to Breath and ignores the rear DIP switches. Normal bank
; and release builds leave FMD_FORCE_ALGORITHM unset and retain DIP selection.
;
; SPDX-License-Identifier: GPL-3.0-or-later
[platformio]
default_envs = nanoatmega328new

[env]
build_flags =
    -Ilib/fmd/include
lib_ldf_mode = deep+

[env:nanoatmega328new]
platform = atmelavr@5.3.0
board = nanoatmega328new
framework = arduino
extra_scripts =
    pre:scripts/platformio_algorithm_target.py
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -Isrc
    -Ilib/fmd/include
    -std=gnu++17
    -Wall
    -Wextra
monitor_speed = 115200

[env:nanoatmega328]
extends = env:nanoatmega328new
board = nanoatmega328

[env:native]
platform = native@1.2.1
test_framework = unity
extra_scripts =
    pre:scripts/platformio_strict_warnings.py
    pre:scripts/platformio_algorithm_target.py
build_flags =
    ${env.build_flags}
    -Itest/support
    -std=c++17
    -Wall
    -Wextra
    -DUNITY_INCLUDE_DOUBLE

[env:native_coverage]
extends = env:native
extra_scripts =
    pre:scripts/platformio_strict_warnings.py
    pre:scripts/platformio_coverage.py
build_flags =
    ${env:native.build_flags}
    -O0
    -g
    --coverage
build_unflags =
    -O1
    -O2
    -O3

[env:native_sanitized]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O1
    -g
    -fno-omit-frame-pointer
    -fsanitize=address,undefined
    -fno-sanitize-recover=all

[env:nanoatmega328new_timing]
extends = env:nanoatmega328new
build_flags =
    ${env:nanoatmega328new.build_flags}
    -DFMD_TIMING_PROBE=1


; Optional compile-time alternative bank. The default environments above remain
; byte-for-byte Classic in bank selection unless FMD_ALGORITHM_BANK is defined.
[env:nanoatmega328new_organic]
extends = env:nanoatmega328new
build_flags =
    ${env:nanoatmega328new.build_flags}
    -DFMD_ALGORITHM_BANK=1

[env:nanoatmega328_organic]
extends = env:nanoatmega328new_organic
board = nanoatmega328

[env:native_organic]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DFMD_ALGORITHM_BANK=1

[env:native_organic_coverage]
extends = env:native_coverage
build_flags =
    ${env:native_coverage.build_flags}
    -DFMD_ALGORITHM_BANK=1

[env:native_organic_sanitized]
extends = env:native_sanitized
build_flags =
    ${env:native_sanitized.build_flags}
    -DFMD_ALGORITHM_BANK=1

[env:nanoatmega328new_organic_timing]
extends = env:nanoatmega328new_organic
build_flags =
    ${env:nanoatmega328new_organic.build_flags}
    -DFMD_TIMING_PROBE=1

; Optional compile-time Generative bank: Turing, Markov, Motif and Urn.
[env:nanoatmega328new_generative]
extends = env:nanoatmega328new
build_flags =
    ${env:nanoatmega328new.build_flags}
    -DFMD_ALGORITHM_BANK=2

[env:nanoatmega328_generative]
extends = env:nanoatmega328new_generative
board = nanoatmega328

[env:native_generative]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DFMD_ALGORITHM_BANK=2

[env:native_generative_coverage]
extends = env:native_coverage
build_flags =
    ${env:native_coverage.build_flags}
    -DFMD_ALGORITHM_BANK=2

[env:native_generative_sanitized]
extends = env:native_sanitized
build_flags =
    ${env:native_sanitized.build_flags}
    -DFMD_ALGORITHM_BANK=2

[env:nanoatmega328new_generative_timing]
extends = env:nanoatmega328new_generative
build_flags =
    ${env:nanoatmega328new_generative.build_flags}
    -DFMD_TIMING_PROBE=1

; Optional compile-time Ambient bank: Current, Anchor, Breath and Fog.
[env:nanoatmega328new_ambient]
extends = env:nanoatmega328new
build_flags =
    ${env:nanoatmega328new.build_flags}
    -DFMD_ALGORITHM_BANK=3

[env:nanoatmega328_ambient]
extends = env:nanoatmega328new_ambient
board = nanoatmega328

[env:native_ambient]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DFMD_ALGORITHM_BANK=3

[env:native_ambient_coverage]
extends = env:native_coverage
build_flags =
    ${env:native_coverage.build_flags}
    -DFMD_ALGORITHM_BANK=3

[env:native_ambient_sanitized]
extends = env:native_sanitized
build_flags =
    ${env:native_sanitized.build_flags}
    -DFMD_ALGORITHM_BANK=3

[env:nanoatmega328new_ambient_timing]
extends = env:nanoatmega328new_ambient
build_flags =
    ${env:nanoatmega328new_ambient.build_flags}
    -DFMD_TIMING_PROBE=1

; Optional compile-time Electronica bank: Pump, Acid, Shuffle and Polymeter.
[env:nanoatmega328new_electronica]
