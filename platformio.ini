; PlatformIO project configuration for the Free Modular Drift alternative firmware.
;
; Environments mirror the engineering pattern used by eurorack-quantizer-firmware:
;   nanoatmega328new         Arduino Nano, current bootloader (default)
;   nanoatmega328            Arduino Nano, legacy bootloader
;   native                   host-side Unity tests
;   native_coverage          GCC/gcov coverage instrumentation
;   native_sanitized         ASan/UBSan
;   nanoatmega328new_timing  non-release timing probe image
;
; SPDX-License-Identifier: GPL-3.0-or-later
[platformio]
default_envs = nanoatmega328new

[env]
build_flags =
    -Ilib/fmd/include
lib_ldf_mode = deep+

[env:nanoatmega328new]
platform = atmelavr@5.3.0
board = nanoatmega328new
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -Isrc
    -Ilib/fmd/include
    -std=gnu++17
    -Wall
    -Wextra
monitor_speed = 115200

[env:nanoatmega328]
extends = env:nanoatmega328new
board = nanoatmega328

[env:native]
platform = native@1.2.1
test_framework = unity
extra_scripts = pre:scripts/platformio_strict_warnings.py
build_flags =
    ${env.build_flags}
    -Itest/support
    -std=c++17
    -Wall
    -Wextra
    -DUNITY_INCLUDE_DOUBLE

[env:native_coverage]
extends = env:native
extra_scripts =
    pre:scripts/platformio_strict_warnings.py
    pre:scripts/platformio_coverage.py
build_flags =
    ${env:native.build_flags}
    -O0
    -g
    --coverage
build_unflags =
    -O1
    -O2
    -O3

[env:native_sanitized]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O1
    -g
    -fno-omit-frame-pointer
    -fsanitize=address,undefined
    -fno-sanitize-recover=all

[env:nanoatmega328new_timing]
extends = env:nanoatmega328new
build_flags =
    ${env:nanoatmega328new.build_flags}
    -DFMD_TIMING_PROBE=1
