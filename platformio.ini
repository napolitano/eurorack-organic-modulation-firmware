; PlatformIO project configuration for the Free Modular Drift alternative firmware.
;
; Environments mirror the engineering pattern used by eurorack-quantizer-firmware:
;   nanoatmega328new         Arduino Nano, current bootloader (default)
;   nanoatmega328            Arduino Nano, legacy bootloader
;   native                           Classic-bank host-side Unity tests
;   native_coverage                  Classic-bank GCC/gcov coverage instrumentation
;   native_sanitized                 Classic-bank ASan/UBSan
;   nanoatmega328new_timing          Classic-bank non-release timing probe image
;   nanoatmega328new_organic         Organic-bank Nano, current bootloader
;   nanoatmega328_organic            Organic-bank Nano, legacy bootloader
;   native_organic                   Organic-bank host-side Unity tests
;   native_organic_coverage          Organic-bank GCC/gcov coverage instrumentation
;   native_organic_sanitized         Organic-bank ASan/UBSan
;   nanoatmega328new_organic_timing  Organic-bank timing probe image
;   nanoatmega328new_generative      Generative-bank Nano, current bootloader
;   nanoatmega328_generative         Generative-bank Nano, legacy bootloader
;   native_generative                Generative-bank host-side Unity tests
;   native_generative_coverage       Generative-bank GCC/gcov coverage instrumentation
;   native_generative_sanitized      Generative-bank ASan/UBSan
;   nanoatmega328new_generative_timing Generative-bank timing probe image
;
; SPDX-License-Identifier: GPL-3.0-or-later
[platformio]
default_envs = nanoatmega328new

[env]
build_flags =
    -Ilib/fmd/include
lib_ldf_mode = deep+

[env:nanoatmega328new]
platform = atmelavr@5.3.0
board = nanoatmega328new
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -Isrc
    -Ilib/fmd/include
    -std=gnu++17
    -Wall
    -Wextra
monitor_speed = 115200

[env:nanoatmega328]
extends = env:nanoatmega328new
board = nanoatmega328

[env:native]
platform = native@1.2.1
test_framework = unity
extra_scripts = pre:scripts/platformio_strict_warnings.py
build_flags =
    ${env.build_flags}
    -Itest/support
    -std=c++17
    -Wall
    -Wextra
    -DUNITY_INCLUDE_DOUBLE

[env:native_coverage]
extends = env:native
extra_scripts =
    pre:scripts/platformio_strict_warnings.py
    pre:scripts/platformio_coverage.py
build_flags =
    ${env:native.build_flags}
    -O0
    -g
    --coverage
build_unflags =
    -O1
    -O2
    -O3

[env:native_sanitized]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O1
    -g
    -fno-omit-frame-pointer
    -fsanitize=address,undefined
    -fno-sanitize-recover=all

[env:nanoatmega328new_timing]
extends = env:nanoatmega328new
build_flags =
    ${env:nanoatmega328new.build_flags}
    -DFMD_TIMING_PROBE=1


; Optional compile-time alternative bank. The default environments above remain
; byte-for-byte Classic in bank selection unless FMD_ALGORITHM_BANK is defined.
[env:nanoatmega328new_organic]
extends = env:nanoatmega328new
build_flags =
    ${env:nanoatmega328new.build_flags}
    -DFMD_ALGORITHM_BANK=1

[env:nanoatmega328_organic]
extends = env:nanoatmega328new_organic
board = nanoatmega328

[env:native_organic]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DFMD_ALGORITHM_BANK=1

[env:native_organic_coverage]
extends = env:native_coverage
build_flags =
    ${env:native_coverage.build_flags}
    -DFMD_ALGORITHM_BANK=1

[env:native_organic_sanitized]
extends = env:native_sanitized
build_flags =
    ${env:native_sanitized.build_flags}
    -DFMD_ALGORITHM_BANK=1

[env:nanoatmega328new_organic_timing]
extends = env:nanoatmega328new_organic
build_flags =
    ${env:nanoatmega328new_organic.build_flags}
    -DFMD_TIMING_PROBE=1

; Optional compile-time Generative bank: Turing, Markov, Motif and Urn.
[env:nanoatmega328new_generative]
extends = env:nanoatmega328new
build_flags =
    ${env:nanoatmega328new.build_flags}
    -DFMD_ALGORITHM_BANK=2

[env:nanoatmega328_generative]
extends = env:nanoatmega328new_generative
board = nanoatmega328

[env:native_generative]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DFMD_ALGORITHM_BANK=2

[env:native_generative_coverage]
extends = env:native_coverage
build_flags =
    ${env:native_coverage.build_flags}
    -DFMD_ALGORITHM_BANK=2

[env:native_generative_sanitized]
extends = env:native_sanitized
build_flags =
    ${env:native_sanitized.build_flags}
    -DFMD_ALGORITHM_BANK=2

[env:nanoatmega328new_generative_timing]
extends = env:nanoatmega328new_generative
build_flags =
    ${env:nanoatmega328new_generative.build_flags}
    -DFMD_TIMING_PROBE=1
