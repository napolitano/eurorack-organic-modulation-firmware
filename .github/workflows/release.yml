# Purpose: GitHub Actions automation for tagged FM Drift firmware releases.
# Original FM Drift concept and Rust firmware: Quinn Freedman
# SPDX-License-Identifier: GPL-3.0-or-later

name: Release firmware

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild (for example v0.1.0 or 0.1.0)'
        required: true
        type: string
      operation:
        description: 'Refresh replaces matching assets; recreate deletes and rebuilds the GitHub Release while keeping the tag'
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - recreate

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build release firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve release tag and source revision
        id: release-context
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_TAG='${{ inputs.release_tag }}'
            RELEASE_TAG="${RELEASE_TAG#refs/tags/}"
            if [[ "${RELEASE_TAG}" != v* ]]; then
              RELEASE_TAG="v${RELEASE_TAG}"
            fi
            RELEASE_OPERATION='${{ inputs.operation }}'

            git fetch --force --tags origin
            if ! git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
              echo "Requested release tag does not exist: ${RELEASE_TAG}" >&2
              exit 1
            fi
            git checkout --detach "${RELEASE_TAG}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_OPERATION="publish"
          fi

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH, got ${RELEASE_TAG}" >&2
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          SOURCE_COMMIT="$(git rev-parse HEAD)"

          RELEASE_BANKS="classic"
          if grep -q '^\[env:native_organic\]$' platformio.ini \
            && grep -q '^\[env:nanoatmega328new_organic\]$' platformio.ini \
            && grep -q '^\[env:nanoatmega328_organic\]$' platformio.ini; then
            RELEASE_BANKS="${RELEASE_BANKS},organic"
          fi
          if grep -q '^\[env:native_generative\]$' platformio.ini \
            && grep -q '^\[env:nanoatmega328new_generative\]$' platformio.ini \
            && grep -q '^\[env:nanoatmega328_generative\]$' platformio.ini; then
            RELEASE_BANKS="${RELEASE_BANKS},generative"
          fi
          if grep -q '^\[env:native_ambient\]$' platformio.ini \
            && grep -q '^\[env:nanoatmega328new_ambient\]$' platformio.ini \
            && grep -q '^\[env:nanoatmega328_ambient\]$' platformio.ini; then
            RELEASE_BANKS="${RELEASE_BANKS},ambient"
          fi

          echo "Release source: ${RELEASE_TAG} @ ${SOURCE_COMMIT}"
          echo "Release operation: ${RELEASE_OPERATION}"
          echo "Release banks: ${RELEASE_BANKS}"

          {
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "RELEASE_VERSION=${RELEASE_VERSION}"
            echo "RELEASE_OPERATION=${RELEASE_OPERATION}"
            echo "RELEASE_BANKS=${RELEASE_BANKS}"
            echo "SOURCE_COMMIT=${SOURCE_COMMIT}"
          } >> "${GITHUB_ENV}"

          {
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_VERSION}"
            echo "operation=${RELEASE_OPERATION}"
            echo "banks=${RELEASE_BANKS}"
            echo "commit=${SOURCE_COMMIT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'

      - name: Cache PlatformIO
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-release-${{ hashFiles('platformio.ini', 'scripts/requirements-ci.txt', 'lib/**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core and coverage tooling
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Validate tag against package metadata
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_VERSION="$(python -c 'import json; print(json.load(open("lib/fmd/library.json", encoding="utf-8"))["version"])')"
          if [[ "${RELEASE_VERSION}" != "${MANIFEST_VERSION}" ]]; then
            echo "Tag version ${RELEASE_VERSION} does not match lib/fmd/library.json ${MANIFEST_VERSION}" >&2
            exit 1
          fi

      - name: Validate repository metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_requirement_traceability.py
          python scripts/check_code_documentation.py
          python scripts/check_markdown_footer.py
          python scripts/check_markdown_math.py
          python scripts/test_generate_release_notes.py
          python scripts/test_avr_resource_budget.py
          python scripts/check_user_manual_source.py
          python scripts/check_manual_assets.py
          python scripts/test_user_manual_tooling.py
          if [[ -f scripts/test_prepare_release_artifacts.py ]]; then
            python scripts/test_prepare_release_artifacts.py
          fi
          if [[ -f scripts/test_check_release_artifact_set.py ]]; then
            PYTHONPATH=scripts python scripts/test_check_release_artifact_set.py
          fi
          if [[ -f scripts/test_freeze_user_manual.py ]]; then
            python scripts/test_freeze_user_manual.py
          fi

      - name: Run Classic-bank native tests
        run: pio test -e native

      - name: Run Organic-bank native tests
        if: contains(steps.release-context.outputs.banks, 'organic')
        run: pio test -e native_organic

      - name: Run Generative-bank native tests
        if: contains(steps.release-context.outputs.banks, 'generative')
        run: pio test -e native_generative

      - name: Run Ambient-bank native tests
        if: contains(steps.release-context.outputs.banks, 'ambient')
        run: pio test -e native_ambient

      - name: Run native sanitizers
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          pio test -e native_sanitized
          if [[ "${RELEASE_BANKS}" == *organic* ]]; then
            pio test -e native_organic_sanitized
          fi
          if [[ "${RELEASE_BANKS}" == *generative* ]]; then
            pio test -e native_generative_sanitized
          fi
          if [[ "${RELEASE_BANKS}" == *ambient* ]]; then
            pio test -e native_ambient_sanitized
          fi

      - name: Enforce Classic-bank native coverage policy
        shell: bash
        run: |
          set -euo pipefail
          pio test -e native_coverage
          mkdir -p coverage
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude 'lib/fmd/src/domain/(AttractorAlgorithm|FractalAlgorithm|OrganicAlgorithmMath|RainAlgorithm|VectorAlgorithm|GenerativeAlgorithmMath|TuringAlgorithm|MarkovAlgorithm|MotifAlgorithm|UrnAlgorithm)\.cpp$' \
            --xml-pretty --output coverage/coverage.xml
          python scripts/check_native_coverage.py coverage/coverage.xml

      - name: Enforce Organic-bank native coverage policy
        if: contains(steps.release-context.outputs.banks, 'organic')
        run: |
          pio test -e native_organic_coverage
          mkdir -p coverage-organic
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude 'lib/fmd/src/domain/(BezierAlgorithm|BrownianAlgorithm|LfoAlgorithm|PerlinAlgorithm|GenerativeAlgorithmMath|TuringAlgorithm|MarkovAlgorithm|MotifAlgorithm|UrnAlgorithm)\.cpp$' \
            --xml-pretty --output coverage-organic/coverage.xml
          python scripts/check_native_coverage.py coverage-organic/coverage.xml

      - name: Enforce Generative-bank native coverage policy
        if: contains(steps.release-context.outputs.banks, 'generative')
        run: |
          pio test -e native_generative_coverage
          mkdir -p coverage-generative
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude 'lib/fmd/src/domain/(BezierAlgorithm|BrownianAlgorithm|LfoAlgorithm|PerlinAlgorithm|AttractorAlgorithm|FractalAlgorithm|OrganicAlgorithmMath|RainAlgorithm|VectorAlgorithm)\.cpp$' \
            --xml-pretty --output coverage-generative/coverage.xml
          python scripts/check_native_coverage.py coverage-generative/coverage.xml

      - name: Enforce Ambient-bank native coverage policy
        if: contains(steps.release-context.outputs.banks, 'ambient')
        run: |
          pio test -e native_ambient_coverage
          mkdir -p coverage-ambient
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude 'lib/fmd/src/domain/(BezierAlgorithm|BrownianAlgorithm|LfoAlgorithm|PerlinAlgorithm|AttractorAlgorithm|FractalAlgorithm|OrganicAlgorithmMath|RainAlgorithm|VectorAlgorithm|GenerativeAlgorithmMath|TuringAlgorithm|MarkovAlgorithm|MotifAlgorithm|UrnAlgorithm)\.cpp$' \
            --xml-pretty --output coverage-ambient/coverage.xml
          python scripts/check_native_coverage.py coverage-ambient/coverage.xml

      - name: Build release firmware
        shell: bash
        run: |
          set -euo pipefail
          pio run -e nanoatmega328new
          pio run -e nanoatmega328
          if [[ "${RELEASE_BANKS}" == *organic* ]]; then
            pio run -e nanoatmega328new_organic
            pio run -e nanoatmega328_organic
          fi
          if [[ "${RELEASE_BANKS}" == *generative* ]]; then
            pio run -e nanoatmega328new_generative
            pio run -e nanoatmega328_generative
          fi
          if [[ "${RELEASE_BANKS}" == *ambient* ]]; then
            pio run -e nanoatmega328new_ambient
            pio run -e nanoatmega328_ambient
          fi

      - name: Enforce AVR resource budgets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328new/firmware.elf
          python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328/firmware.elf
          if [[ "${RELEASE_BANKS}" == *organic* ]]; then
            python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328new_organic/firmware.elf
            python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328_organic/firmware.elf
          fi
          if [[ "${RELEASE_BANKS}" == *generative* ]]; then
            python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328new_generative/firmware.elf
            python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328_generative/firmware.elf
          fi
          if [[ "${RELEASE_BANKS}" == *ambient* ]]; then
            python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328new_ambient/firmware.elf
            python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328_ambient/firmware.elf
          fi

      - name: Compile timing qualification images
        shell: bash
        run: |
          set -euo pipefail
          pio run -e nanoatmega328new_timing
          if [[ "${RELEASE_BANKS}" == *organic* ]]; then
            pio run -e nanoatmega328new_organic_timing
          fi
          if [[ "${RELEASE_BANKS}" == *generative* ]]; then
            pio run -e nanoatmega328new_generative_timing
          fi
          if [[ "${RELEASE_BANKS}" == *ambient* ]]; then
            pio run -e nanoatmega328new_ambient_timing
          fi

      - name: Install manual publication dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          # GitHub's Ubuntu runner uses an Azure-first mirror list. A stalled
          # Azure mirror must not be able to hold a release for hours.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              -e 's#http://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
              -e 's#http://archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
              -e 's#http://security\.ubuntu\.com/ubuntu#https://security.ubuntu.com/ubuntu#g' \
              /etc/apt/apt-mirrors.txt
            echo "APT mirror list used for manual publication:"
            cat /etc/apt/apt-mirrors.txt
          fi

          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o Acquire::ForceIPv4=true
            -o Acquire::Languages=none
          )

          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            apt_options+=(
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
              -o Dir::Etc::sourceparts=-
              -o APT::Get::List-Cleanup=0
            )
          fi

          sudo apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install \
            -y --no-install-recommends \
            libreoffice-writer fonts-ubuntu poppler-utils

          fc-cache -f
          libreoffice --version || soffice --version
          echo "Resolved manual fonts:"
          fc-match -f "Ubuntu Regular -> %{family} | %{style} | %{file}\n" "Ubuntu:style=Regular"
          fc-match -f "Ubuntu Light   -> %{family} | %{style} | %{file}\n" "Ubuntu Light:style=Regular"

      - name: Check out current release tooling for manual rebuild
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          path: .release-tooling

      - name: Validate manual-rebuild tooling
        if: github.event_name == 'workflow_dispatch'
        run: |
          python .release-tooling/scripts/test_prepare_release_artifacts.py
          PYTHONPATH=.release-tooling/scripts python .release-tooling/scripts/test_check_release_artifact_set.py
          python .release-tooling/scripts/test_generate_release_notes.py
          python .release-tooling/scripts/test_user_manual_tooling.py
          if [[ -f .release-tooling/scripts/test_freeze_user_manual.py ]]; then
            PYTHONPATH=.release-tooling/scripts python .release-tooling/scripts/test_freeze_user_manual.py
          fi

      - name: Resolve frozen user-manual source
        id: manual-source
        shell: bash
        run: |
          set -euo pipefail

          FROZEN_MANUAL="docs/manual/releases/${RELEASE_VERSION}/drift-user-manual.${RELEASE_VERSION}.odt"
          LEGACY_MANUAL="docs/manual/drift-user-manual.odt"

          # Tags created after the freeze mechanism was introduced must carry
          # an immutable release-specific ODT snapshot. Older tags (notably
          # v0.1.0) predate that mechanism; their unversioned ODT inside the
          # tag is itself the historical source and remains a valid fallback.
          if [[ -f scripts/freeze_user_manual.py ]]; then
            python scripts/freeze_user_manual.py --version "${RELEASE_VERSION}" --check
            MANUAL_SOURCE="${FROZEN_MANUAL}"
            MANUAL_SOURCE_KIND="frozen"
          else
            if [[ ! -f "${LEGACY_MANUAL}" ]]; then
              echo "Historical tag has no user-manual source: ${LEGACY_MANUAL}" >&2
              exit 1
            fi
            MANUAL_SOURCE="${LEGACY_MANUAL}"
            MANUAL_SOURCE_KIND="legacy-tag-source"
          fi

          echo "Manual source (${MANUAL_SOURCE_KIND}): ${MANUAL_SOURCE}"
          {
            echo "source=${MANUAL_SOURCE}"
            echo "kind=${MANUAL_SOURCE_KIND}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require Generative content in frozen manual
        if: contains(steps.release-context.outputs.banks, 'generative')
        shell: bash
        run: |
          set -euo pipefail
          MANUAL_SOURCE='${{ steps.manual-source.outputs.source }}'
          python - "${MANUAL_SOURCE}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          source = sys.argv[1]
          with zipfile.ZipFile(source) as archive:
              root = ET.fromstring(archive.read("content.xml"))
          text = " ".join(part.strip() for part in root.itertext() if part.strip()).lower()
          required = ("generative", "turing", "markov", "motif", "urn")
          missing = [term for term in required if term not in text]
          if missing:
              raise SystemExit(
                  "release manual does not yet document the Generative bank: missing "
                  + ", ".join(missing)
              )
          print("Generative manual coverage: passed")
          PY

      - name: Require Ambient content in frozen manual
        if: contains(steps.release-context.outputs.banks, 'ambient')
        shell: bash
        run: |
          set -euo pipefail
          MANUAL_SOURCE='${{ steps.manual-source.outputs.source }}'
          python - "${MANUAL_SOURCE}" <<'PY'
          import sys, xml.etree.ElementTree as ET, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              root = ET.fromstring(archive.read("content.xml"))
          text = " ".join(part.strip() for part in root.itertext() if part.strip()).lower()
          required = ("ambient", "current", "anchor", "breath", "fog")
          missing = [term for term in required if term not in text]
          if missing:
              raise SystemExit("release manual does not yet document the Ambient bank: missing " + ", ".join(missing))
          print("Ambient manual coverage: passed")
          PY

      - name: Build and verify user manual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          MANUAL_SOURCE='${{ steps.manual-source.outputs.source }}'
          VERSIONED_ODT="dist/drift-user-manual.${RELEASE_VERSION}.odt"

          python scripts/build_user_manual.py \
            --version "${RELEASE_VERSION}" \
            --source "${MANUAL_SOURCE}" \
            --output-dir dist
          cp "${MANUAL_SOURCE}" "${VERSIONED_ODT}"

          echo "Embedded PDF fonts:"
          pdffonts "dist/drift-user-manual.${RELEASE_VERSION}.pdf"
          MANUAL_CHECKER="scripts/check_user_manual.py"
          if [[ -f .release-tooling/scripts/check_user_manual.py ]]; then
            MANUAL_CHECKER=".release-tooling/scripts/check_user_manual.py"
          fi
          python "${MANUAL_CHECKER}" \
            "dist/drift-user-manual.${RELEASE_VERSION}.pdf" \
            --source "${MANUAL_SOURCE}"
          echo "Published manual source SHA-256:"
          sha256sum "${VERSIONED_ODT}"

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          TOOLING_ROOT="scripts"
          if [[ -d .release-tooling/scripts ]]; then
            TOOLING_ROOT=".release-tooling/scripts"
          fi

          python "${TOOLING_ROOT}/prepare_release_artifacts.py" \
            --version "${RELEASE_VERSION}" \
            --banks "${RELEASE_BANKS}" \
            --output-dir dist

          python "${TOOLING_ROOT}/write_build_info.py" \
            --bank classic \
            --environment nanoatmega328new \
            --git-commit "${SOURCE_COMMIT}" \
            --git-ref "${RELEASE_TAG}" \
            --output "dist/BUILD-INFO-classic-nano-new.${RELEASE_VERSION}.txt"
          python "${TOOLING_ROOT}/write_build_info.py" \
            --bank classic \
            --environment nanoatmega328 \
            --git-commit "${SOURCE_COMMIT}" \
            --git-ref "${RELEASE_TAG}" \
            --output "dist/BUILD-INFO-classic-nano-old.${RELEASE_VERSION}.txt"

          if [[ "${RELEASE_BANKS}" == *organic* ]]; then
            python "${TOOLING_ROOT}/write_build_info.py" \
              --bank organic \
              --environment nanoatmega328new_organic \
              --git-commit "${SOURCE_COMMIT}" \
              --git-ref "${RELEASE_TAG}" \
              --output "dist/BUILD-INFO-organic-nano-new.${RELEASE_VERSION}.txt"
            python "${TOOLING_ROOT}/write_build_info.py" \
              --bank organic \
              --environment nanoatmega328_organic \
              --git-commit "${SOURCE_COMMIT}" \
              --git-ref "${RELEASE_TAG}" \
              --output "dist/BUILD-INFO-organic-nano-old.${RELEASE_VERSION}.txt"
          fi

          if [[ "${RELEASE_BANKS}" == *generative* ]]; then
            python "${TOOLING_ROOT}/write_build_info.py" \
              --bank generative \
              --environment nanoatmega328new_generative \
              --git-commit "${SOURCE_COMMIT}" \
              --git-ref "${RELEASE_TAG}" \
              --output "dist/BUILD-INFO-generative-nano-new.${RELEASE_VERSION}.txt"
            python "${TOOLING_ROOT}/write_build_info.py" \
              --bank generative \
              --environment nanoatmega328_generative \
              --git-commit "${SOURCE_COMMIT}" \
              --git-ref "${RELEASE_TAG}" \
              --output "dist/BUILD-INFO-generative-nano-old.${RELEASE_VERSION}.txt"
          fi

          if [[ "${RELEASE_BANKS}" == *ambient* ]]; then
            python "${TOOLING_ROOT}/write_build_info.py" \
              --bank ambient \
              --environment nanoatmega328new_ambient \
              --git-commit "${SOURCE_COMMIT}" \
              --git-ref "${RELEASE_TAG}" \
              --output "dist/BUILD-INFO-ambient-nano-new.${RELEASE_VERSION}.txt"
            python "${TOOLING_ROOT}/write_build_info.py" \
              --bank ambient \
              --environment nanoatmega328_ambient \
              --git-commit "${SOURCE_COMMIT}" \
              --git-ref "${RELEASE_TAG}" \
              --output "dist/BUILD-INFO-ambient-nano-old.${RELEASE_VERSION}.txt"
          fi

      - name: Validate exact release artifact set
        shell: bash
        run: |
          set -euo pipefail
          TOOLING_ROOT="scripts"
          if [[ -d .release-tooling/scripts ]]; then
            TOOLING_ROOT=".release-tooling/scripts"
          fi
          python "${TOOLING_ROOT}/check_release_artifact_set.py" \
            --version "${RELEASE_VERSION}" \
            --banks "${RELEASE_BANKS}" \
            --output-dir dist

      - name: Generate release checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS.txt' \
            ! -name 'MD5SUMS.txt' \
            -printf '%f\n' | LC_ALL=C sort > /tmp/release-files.txt
          xargs -r sha256sum < /tmp/release-files.txt > SHA256SUMS.txt
          xargs -r md5sum < /tmp/release-files.txt > MD5SUMS.txt

      - name: Generate changelog-based release notes
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          TOOLING_ROOT="scripts"
          if [[ -d .release-tooling/scripts ]]; then
            TOOLING_ROOT=".release-tooling/scripts"
          fi
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          python "${TOOLING_ROOT}/generate_release_notes.py" \
            --tag "${RELEASE_TAG}" \
            --previous-tag "${PREVIOUS_TAG}" \
            --repository "${REPOSITORY}" \
            --server-url "${SERVER_URL}" \
            --banks "${RELEASE_BANKS}" \
            > release-notes.md
          cat release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-artifacts-${{ steps.release-context.outputs.tag }}
          path: dist/

      - name: Publish, refresh or recreate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_exists=false
          release_immutable=false
          release_was_latest=false
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_exists=true
            release_immutable="$(gh release view "${RELEASE_TAG}" --json isImmutable --jq '.isImmutable')"
            release_was_latest="$(gh release list --limit 100 --json tagName,isLatest --jq ".[] | select(.tagName == \"${RELEASE_TAG}\") | .isLatest" | head -n1)"
          fi

          if [[ "${release_exists}" == true && "${release_immutable}" == true ]]; then
            echo "Release ${RELEASE_TAG} is immutable and cannot be refreshed or recreated." >&2
            exit 1
          fi

          create_release() {
            local latest_flag=()
            if [[ "${RELEASE_OPERATION}" == "recreate" && -n "${release_was_latest}" ]]; then
              if [[ "${release_was_latest}" == true ]]; then
                latest_flag=(--latest)
              else
                latest_flag=(--latest=false)
              fi
            fi

            local commit_guard=()
            if [[ "${RELEASE_OPERATION}" == "publish" ]]; then
              commit_guard=(--fail-on-no-commits)
            fi

            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              "${commit_guard[@]}" \
              "${latest_flag[@]}" \
              --notes-file release-notes.md \
              --title "${RELEASE_TAG}"
          }

          case "${RELEASE_OPERATION}" in
            publish)
              if [[ "${release_exists}" == true ]]; then
                echo "Release already exists; refreshing matching generated assets in place."
                gh release upload "${RELEASE_TAG}" dist/* --clobber
              else
                create_release
              fi
              ;;
            refresh)
              if [[ "${release_exists}" == true ]]; then
                echo "Refreshing matching generated assets for ${RELEASE_TAG}; release metadata and unrelated assets are preserved."
                gh release upload "${RELEASE_TAG}" dist/* --clobber
              else
                echo "Release ${RELEASE_TAG} does not exist; creating it from the existing tag."
                create_release
              fi
              ;;
            recreate)
              if [[ "${release_exists}" == true ]]; then
                echo "Deleting GitHub Release ${RELEASE_TAG}; the Git tag is retained."
                gh release delete "${RELEASE_TAG}" --yes
              fi
              create_release
              ;;
            *)
              echo "Unknown release operation: ${RELEASE_OPERATION}" >&2
              exit 1
              ;;
          esac
