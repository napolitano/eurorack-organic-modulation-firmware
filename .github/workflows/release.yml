# Purpose: GitHub Actions automation for tagged FM Drift firmware releases.
# Original FM Drift concept and Rust firmware: Quinn Freedman
# SPDX-License-Identifier: GPL-3.0-or-later

name: Release firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build release firmware
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'

      - name: Cache PlatformIO
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-release-${{ hashFiles('platformio.ini', 'scripts/requirements-ci.txt', 'lib/**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core and coverage tooling
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Validate tag against package metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          MANIFEST_VERSION="$(python -c 'import json; print(json.load(open("lib/fmd/library.json", encoding="utf-8"))["version"])')"
          if [[ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]]; then
            echo "Tag version ${TAG_VERSION} does not match lib/fmd/library.json ${MANIFEST_VERSION}" >&2
            exit 1
          fi

      - name: Validate repository metadata
        run: |
          python scripts/check_requirement_traceability.py
          python scripts/check_markdown_footer.py
          python scripts/test_generate_release_notes.py
          python scripts/test_avr_resource_budget.py
          python scripts/check_user_manual_source.py
          python scripts/check_manual_assets.py
          python scripts/test_user_manual_tooling.py

      - name: Run native tests
        run: pio test -e native

      - name: Run native sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: pio test -e native_sanitized

      - name: Enforce native coverage policy
        run: |
          pio test -e native_coverage
          mkdir -p coverage
          gcovr --root . --filter lib/fmd/src --exclude test --xml-pretty --output coverage/coverage.xml
          python scripts/check_native_coverage.py coverage/coverage.xml

      - name: Build both Nano targets
        run: |
          pio run -e nanoatmega328new
          pio run -e nanoatmega328

      - name: Enforce AVR resource budgets
        run: |
          python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328new/firmware.elf
          python scripts/check_avr_resource_budget.py .pio/build/nanoatmega328/firmware.elf

      - name: Compile timing qualification image
        run: pio run -e nanoatmega328new_timing

      - name: Install manual publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-ubuntu-classic poppler-utils
          fc-cache -f

      - name: Build and verify user manual
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            MANUAL_VERSION="${GITHUB_REF_NAME#v}"
          else
            MANUAL_VERSION="0.0.0-ci"
          fi
          mkdir -p dist
          python scripts/build_user_manual.py --version "${MANUAL_VERSION}" --output-dir dist
          python scripts/check_user_manual.py "dist/drift-user-manual.${MANUAL_VERSION}.pdf"

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          cp .pio/build/nanoatmega328new/firmware.hex dist/fm-drift-nano-new-bootloader.hex
          cp .pio/build/nanoatmega328new/firmware.elf dist/fm-drift-nano-new-bootloader.elf
          cp .pio/build/nanoatmega328/firmware.hex dist/fm-drift-nano-old-bootloader.hex
          cp .pio/build/nanoatmega328/firmware.elf dist/fm-drift-nano-old-bootloader.elf
          cp README.md CHANGELOG.md LICENSE dist/
          python scripts/write_build_info.py --output dist/BUILD-INFO.txt --environment nanoatmega328new

      - name: Generate release checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS.txt' \
            ! -name 'MD5SUMS.txt' \
            -printf '%f\n' | LC_ALL=C sort > /tmp/release-files.txt
          xargs -r sha256sum < /tmp/release-files.txt > SHA256SUMS.txt
          xargs -r md5sum < /tmp/release-files.txt > MD5SUMS.txt

      - name: Generate changelog-based release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          python scripts/generate_release_notes.py \
            --tag "${RELEASE_TAG}" \
            --previous-tag "${PREVIOUS_TAG}" \
            --repository "${REPOSITORY}" \
            --server-url "${SERVER_URL}" \
            > release-notes.md
          cat release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-firmware
          path: dist/

      - name: Publish GitHub release for tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --fail-on-no-commits \
            --notes-file release-notes.md \
            --title "${GITHUB_REF_NAME}"
