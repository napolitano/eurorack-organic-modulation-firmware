# Purpose: Validate and smoke-build the Drift end-user manual publication path.
# SPDX-License-Identifier: GPL-3.0-or-later

name: Manual publication

on:
  push:
    paths:
      - 'docs/manual/**'
      - 'scripts/build_user_manual.py'
      - 'scripts/check_user_manual.py'
      - 'scripts/check_user_manual_source.py'
      - 'scripts/check_manual_assets.py'
      - 'scripts/test_user_manual_tooling.py'
      - '.github/workflows/manual-publication.yml'
  pull_request:
    paths:
      - 'docs/manual/**'
      - 'scripts/build_user_manual.py'
      - 'scripts/check_user_manual.py'
      - 'scripts/check_user_manual_source.py'
      - 'scripts/check_manual_assets.py'
      - 'scripts/test_user_manual_tooling.py'
      - '.github/workflows/manual-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual:
    name: Build and verify user manual
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'

      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-ubuntu-classic poppler-utils
          fc-cache -f

      - name: Validate maintained manual source and vector assets
        run: |
          python scripts/check_user_manual_source.py
          python scripts/check_manual_assets.py
          python scripts/test_user_manual_tooling.py

      - name: Build publication smoke artifact
        run: python scripts/build_user_manual.py --version 0.0.0-ci --output-dir dist/manual

      - name: Validate publication artifact
        run: python scripts/check_user_manual.py dist/manual/drift-user-manual.0.0.0-ci.pdf

      - name: Upload manual smoke artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: drift-user-manual-smoke
          path: dist/manual/drift-user-manual.0.0.0-ci.pdf
