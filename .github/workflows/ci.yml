  native-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: |
          pio test -e native_coverage \
            -f unit/test_rng \
            -f unit/test_frequency \
            -f unit/test_algorithms \
            -f unit/test_fixed_math \
            -f unit/test_perlin_algorithm \
            -f unit/test_brownian_algorithm \
            -f unit/test_bezier_algorithm \
            -f unit/test_lfo_algorithm \
            -f unit/test_reference_tables \
            -f integration/test_selection \
            -f integration/test_runtime \
            -f property/test_invariants \
            -f regression/test_upstream_behaviour \
            -f system/test_signal_path
      - run: |
          mkdir -p coverage
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude-throw-branches --exclude-unreachable-branches \
            --exclude 'lib/fmd/src/domain/(organic|generative|ambient|electronica|percussion)/.*' \
            --xml-pretty --output coverage/coverage.xml
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude-throw-branches --exclude-unreachable-branches \
            --exclude 'lib/fmd/src/domain/(organic|generative|ambient|electronica|percussion)/.*' \
            --txt
          python scripts/check_native_coverage.py coverage/coverage.xml --scope classic


