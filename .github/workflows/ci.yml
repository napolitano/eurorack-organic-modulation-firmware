name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python scripts/check_requirement_traceability.py
      - run: python scripts/check_markdown_footer.py
      - run: python scripts/test_generate_release_notes.py
      - run: python scripts/test_avr_resource_budget.py

  native-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit/test_rng
          - unit/test_frequency
          - unit/test_algorithms
          - unit/test_fixed_math
          - unit/test_perlin_algorithm
          - unit/test_brownian_algorithm
          - unit/test_bezier_algorithm
          - unit/test_lfo_algorithm
          - integration/test_selection
          - integration/test_runtime
          - property/test_invariants
          - regression/test_upstream_behaviour
          - system/test_signal_path
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native -f ${{ matrix.suite }}

  native-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native_coverage
      - run: |
          mkdir -p coverage
          gcovr --root . --filter lib/fmd/src --exclude test --xml-pretty --output coverage/coverage.xml
          gcovr --root . --filter lib/fmd/src --exclude test --txt
          python scripts/check_native_coverage.py coverage/coverage.xml

  native-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native_sanitized

  avr-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: [nanoatmega328new, nanoatmega328]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio run -e ${{ matrix.environment }}
      - run: python scripts/check_avr_resource_budget.py .pio/build/${{ matrix.environment }}/firmware.elf

  timing-probe-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio run -e nanoatmega328new_timing
