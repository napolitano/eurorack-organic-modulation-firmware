name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python scripts/check_requirement_traceability.py
      - run: python scripts/check_code_documentation.py
      - run: python scripts/check_markdown_footer.py
      - run: python scripts/check_markdown_math.py
      - run: python scripts/test_generate_release_notes.py
      - run: python scripts/test_avr_resource_budget.py
      - run: python scripts/test_prepare_release_artifacts.py
      - run: python scripts/test_freeze_user_manual.py

  native-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit/test_rng
          - unit/test_frequency
          - unit/test_algorithms
          - unit/test_fixed_math
          - unit/test_perlin_algorithm
          - unit/test_brownian_algorithm
          - unit/test_bezier_algorithm
          - unit/test_lfo_algorithm
          - unit/test_reference_tables
          - integration/test_selection
          - integration/test_runtime
          - property/test_invariants
          - regression/test_upstream_behaviour
          - system/test_signal_path
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native -f ${{ matrix.suite }}


  native-organic-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit/test_algorithms
          - unit/test_fractal_algorithm
          - unit/test_vector_algorithm
          - unit/test_rain_algorithm
          - unit/test_attractor_algorithm
          - integration/test_selection
          - integration/test_runtime
          - property/test_invariants
          - system/test_signal_path
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native_organic -f ${{ matrix.suite }}

  native-generative-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit/test_algorithms
          - unit/test_turing_algorithm
          - unit/test_markov_algorithm
          - unit/test_motif_algorithm
          - unit/test_urn_algorithm
          - integration/test_selection
          - integration/test_runtime
          - property/test_invariants
          - system/test_signal_path
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native_generative -f ${{ matrix.suite }}

  native-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native_coverage
      - run: |
          mkdir -p coverage
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude 'lib/fmd/src/domain/(AttractorAlgorithm|FractalAlgorithm|OrganicAlgorithmMath|RainAlgorithm|VectorAlgorithm|GenerativeAlgorithmMath|TuringAlgorithm|MarkovAlgorithm|MotifAlgorithm|UrnAlgorithm)\.cpp$' \
            --xml-pretty --output coverage/coverage.xml
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude 'lib/fmd/src/domain/(AttractorAlgorithm|FractalAlgorithm|OrganicAlgorithmMath|RainAlgorithm|VectorAlgorithm|GenerativeAlgorithmMath|TuringAlgorithm|MarkovAlgorithm|MotifAlgorithm|UrnAlgorithm)\.cpp$' \
            --txt
          python scripts/check_native_coverage.py coverage/coverage.xml


  native-organic-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native_organic_coverage
      - run: |
          mkdir -p coverage-organic
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude 'lib/fmd/src/domain/(BezierAlgorithm|BrownianAlgorithm|LfoAlgorithm|PerlinAlgorithm|GenerativeAlgorithmMath|TuringAlgorithm|MarkovAlgorithm|MotifAlgorithm|UrnAlgorithm)\.cpp$' \
            --xml-pretty --output coverage-organic/coverage.xml
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude 'lib/fmd/src/domain/(BezierAlgorithm|BrownianAlgorithm|LfoAlgorithm|PerlinAlgorithm|GenerativeAlgorithmMath|TuringAlgorithm|MarkovAlgorithm|MotifAlgorithm|UrnAlgorithm)\.cpp$' \
            --txt
          python scripts/check_native_coverage.py coverage-organic/coverage.xml

  native-generative-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native_generative_coverage
      - run: |
          mkdir -p coverage-generative
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude 'lib/fmd/src/domain/(BezierAlgorithm|BrownianAlgorithm|LfoAlgorithm|PerlinAlgorithm|AttractorAlgorithm|FractalAlgorithm|OrganicAlgorithmMath|RainAlgorithm|VectorAlgorithm)\.cpp$' \
            --xml-pretty --output coverage-generative/coverage.xml
          gcovr --root . --filter lib/fmd/src --exclude test \
            --exclude 'lib/fmd/src/domain/(BezierAlgorithm|BrownianAlgorithm|LfoAlgorithm|PerlinAlgorithm|AttractorAlgorithm|FractalAlgorithm|OrganicAlgorithmMath|RainAlgorithm|VectorAlgorithm)\.cpp$' \
            --txt
          python scripts/check_native_coverage.py coverage-generative/coverage.xml

  native-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native_sanitized


  native-organic-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native_organic_sanitized

  native-generative-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio test -e native_generative_sanitized

  avr-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment:
          - nanoatmega328new
          - nanoatmega328
          - nanoatmega328new_organic
          - nanoatmega328_organic
          - nanoatmega328new_generative
          - nanoatmega328_generative
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio run -e ${{ matrix.environment }}
      - run: python scripts/check_avr_resource_budget.py .pio/build/${{ matrix.environment }}/firmware.elf

  timing-probe-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: [nanoatmega328new_timing, nanoatmega328new_organic_timing, nanoatmega328new_generative_timing]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: pio run -e ${{ matrix.environment }}
