name: First-pass issue triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.repository == 'napolitano/eurorack-organic-modulation-firmware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out canonical documentation and source
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11.15'

      - name: Analyze and route newly opened issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
          TRIAGE_MAINTAINER: ${{ vars.TRIAGE_MAINTAINER }}
        run: python scripts/issue_triage_agent.py --event "$GITHUB_EVENT_PATH"
