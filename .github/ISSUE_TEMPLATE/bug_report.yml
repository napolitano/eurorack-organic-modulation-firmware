name: Bug report
description: Report a reproducible firmware, algorithm, build, CI, or release problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please provide enough evidence to reproduce the problem. Security vulnerabilities must be reported through the repository security policy rather than a public issue.
  - type: input
    id: version
    attributes:
      label: Firmware version or commit
      description: Use the commit SHA while the firmware is unreleased, or a tagged release once one exists.
      placeholder: "commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Perlin algorithm
        - Brownian algorithm
        - Bézier algorithm
        - LFO algorithm
        - Control / frequency mapping
        - ADC / input handling
        - DAC / output handling
        - LED behavior
        - Runtime / timing
        - Build / PlatformIO
        - Tests / coverage
        - CI / release automation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Hardware and setup
      description: Describe Nano/bootloader variant, original/revised Drift hardware, patches, CV sources and relevant measurements.
      placeholder: "Original Drift PCB, Nano with newer bootloader, Speed CV..."
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Select...
        2. Set...
        3. Patch...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or build output
      description: Include only output needed to diagnose the problem.
      render: shell
  - type: textarea
    id: evidence
    attributes:
      label: Measurements or other evidence
      description: Add oscilloscope captures, output vectors, recordings, photographs or statistical data when they materially support the report.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that this problem is not already covered by an open issue.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I identified whether the observation concerns original Drift behavior or this firmware revision when that distinction matters.
          required: true
